name: Skylit release lambdas
# A Skylit tag (v<upstream>-skylit.<n>) builds this fork's lambdas and publishes their zips as the tag's release,
# so a consumer that pins the module at the tag deploys the same commit's TypeScript, never upstream's.
# release.yml cannot: it needs release-please, a `release` environment and the RELEASER_APP_* secrets.
on:
  push:
    tags:
      - 'v*-skylit.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish lambda zips
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build dist
        working-directory: lambdas
        run: yarn install --immutable && yarn run test && yarn dist
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zips=(
            lambdas/functions/webhook/webhook.zip
            lambdas/functions/control-plane/runners.zip
            lambdas/functions/gh-agent-syncer/runner-binaries-syncer.zip
          )
          ls -l "${zips[@]}"
          sha256sum "${zips[@]}" | sed 's#  .*/#  #' > SHA256SUMS
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" \
            --notes "Lambda zips built from $(git rev-parse HEAD) by skylit-release.yml." \
            "${zips[@]}" SHA256SUMS
